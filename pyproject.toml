[project]
name = "fuel-route-optimizer"
version = "1.0.0"
description = "Route planning API that picks the cheapest fuel stops along a US drive"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["fuelroute/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]
"fuelroute/tests/*" = ["ARG001", "ARG002"]
