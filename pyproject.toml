[project]
name = "fuel-route-optimizer"
version = "1.0.0"
description = "Route planning API that picks the cheapest fuel stops along a US drive"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["fuelroute/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]
"fuelroute/tests/*" = ["ARG001", "ARG002"]

[tool.coverage.run]
source = ["fuelroute", "config"]
omit = [
    "fuelroute/tests/*",
    "config/asgi.py",
    "config/wsgi.py",
    "manage.py",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

# The routing tests pass a hand written fake where the runtime type is a requests
# Session. Structural equivalence is the point of that fake, and the calls are
# checked for real by running them, so only the argument type check is dropped, and
# only in that one module. Everything else in the suite is checked normally.
[[tool.mypy.overrides]]
module = "fuelroute.tests.test_routing"
disable_error_code = ["arg-type"]
