name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy fuelroute config

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      # The floor is set below the measured total so an ordinary refactor does not
      # fail the build, but a chunk of untested code cannot land unnoticed either.
      - name: Tests
        run: pytest -q --cov --cov-report=term --cov-fail-under=95

  docker:
    # Only on a push to main. A pull request already gets the lint, type and test
    # gates, and building the image on every push to a branch would add a couple of
    # minutes for a file that changes rarely.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fuel-route-optimizer .
